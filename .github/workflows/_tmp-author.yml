name: TEMP - Author fixed tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Authenticate
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
          kane-cli config project 01J87QEHKVYWMP0W5E8K5CMXRA

      - name: Author fixed tests
        id: author
        run: |
          failed=0
          for f in .testmuai/tests/verify-separate-isbn-pod-and-global-distribution-claims-for_test.md \
                   .testmuai/tests/verify-supported-release-formats-and-publication-languages_test.md; do
            kane-cli testmd run "$f" --agent --headless --author || failed=1
          done
          exit $failed

      - name: Commit recordings
        if: always()
        run: |
          git config user.name "kane-cli-bot"
          git config user.email "kane-cli-bot@users.noreply.github.com"
          shopt -s nullglob
          output_dirs=(.testmuai/tests/output-*/)
          git add .testmuai/tests/ "${output_dirs[@]}"
          git diff --cached --quiet || git commit -m "temp: re-author fixed tests"
          git push
